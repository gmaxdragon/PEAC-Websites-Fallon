name: Bootstrap exact PEAC runtime

on:
  push:
    paths:
      - ".github/workflows/bootstrap-runtime.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact tested runtime archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/runtime_part_*.txt | base64 --decode > /tmp/peac-runtime.tar.xz
          echo "cc73ba26e439cc49b6ddbb40fc61979d1ab12e76bd056537c8fbd4dea232ab06  /tmp/peac-runtime.tar.xz" | sha256sum -c -
          tar -xJf /tmp/peac-runtime.tar.xz

      - name: Syntax-check Python runtime
        run: |
          python -m py_compile peac.py peac_core.py peac_community.py peac_people.py peac_import.py peac_assistant.py peac_ai.py peac_mail.py peac_backup.py portal_auth.py portal_server.py local_server.py manage_accounts.py demo_seed.py wsgi.py

      - name: Commit normal runtime source and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync exact tested PEAC v7.1 backend runtime"
            git push origin HEAD:main
          fi
