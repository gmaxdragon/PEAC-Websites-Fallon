name: PEAC audit source verification
on:
  push:
    branches: [peac/icons-audit-20261022]
permissions:
  contents: read
jobs:
  verify-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve source packet for checksum verification
        uses: actions/upload-artifact@v4
        with:
          name: peac-source-packet
          path: audit-transfer/
          retention-days: 1
