name: PEAC checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core runtime
        run: python -m pip install -r requirements-core.txt

      - name: Python syntax check
        run: python -m py_compile peac.py peac_core.py peac_community.py peac_people.py peac_import.py peac_assistant.py peac_ai.py peac_mail.py peac_backup.py portal_auth.py portal_server.py local_server.py manage_accounts.py demo_seed.py wsgi.py

      - name: JavaScript syntax check
        run: |
          node --check public.js
          node --check login.js
          node --check auth.js
          node --check charts.js
          node --check script.js
          node --check console.js

      - name: Hosted-mode health smoke test
        env:
          PEAC_DEPLOY_MODE: hosted
          PEAC_HOST: 127.0.0.1
          PEAC_DB_PATH: /tmp/peac-ci.sqlite3
          PEAC_ADMIN_USERNAME: ci-admin
          PEAC_ADMIN_DISPLAY_NAME: CI Admin
          PEAC_ADMIN_PASSWORD: "CI-only-password-12345"
          PEAC_PORT: "5000"
          PEAC_FORCE_LUNCH_OPEN: "1"
        run: |
          python peac.py --local-server >/tmp/peac.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/api/public/config >/tmp/config.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/config.json'))
          assert data['lunch_enabled'] is True, data
          PY
          today=$(date +%F)
          curl --fail --silent -X POST http://127.0.0.1:5000/api/public/lunch             -H 'Content-Type: application/json'             -H 'X-PEAC-Client: 1'             -H 'Idempotency-Key: ci-lunch-request-1234567890'             -d "{\"preferred_name\":\"CI Student\",\"email\":\"ci.student@example.com\",\"grade\":\"8\",\"preferred_date\":\"$today\",\"lunch_period\":\"Lunch\",\"support\":\"company\",\"details\":\"CI smoke test\",\"preferred_buddy\":\"CI Admin\",\"consent\":true,\"website\":\"\"}" >/tmp/lunch.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/lunch.json'))
          assert data['ok'] is True and data['reference'].startswith('LB-'), data
          PY
          curl --fail --silent -c /tmp/peac.cookies -X POST http://127.0.0.1:5000/api/auth/login             -H 'Content-Type: application/json' -H 'X-PEAC-Client: 1'             -d '{"username":"ci-admin","password":"CI-only-password-12345"}' >/tmp/login.json
          csrf=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/login.json'))['csrf'])
          PY
          )
          curl --fail --silent -b /tmp/peac.cookies http://127.0.0.1:5000/api/portal/lunch >/tmp/queue.json
          curl --fail --silent -b /tmp/peac.cookies http://127.0.0.1:5000/api/portal/notifications >/tmp/notifications.json
          curl --fail --silent -b /tmp/peac.cookies -X POST http://127.0.0.1:5000/api/portal/assistant/ask             -H 'Content-Type: application/json' -H 'X-PEAC-Client: 1' -H "X-CSRF-Token: $csrf"             -d '{"question":"what about last week?","history":[{"role":"user","content":"How many verified compliments this month?"}]}' >/tmp/assistant.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/queue.json'))
          n=json.load(open('/tmp/notifications.json'))
          a=json.load(open('/tmp/assistant.json'))
          assert len(q['requests']) == 1, q
          assert q['requests'][0]['preferred_buddy'] == 'CI Admin', q
          assert q['requests'][0]['matched_buddy_user_id'], q
          assert n['unread'] >= 1, n
          assert a['context_used'] is True, a
          assert isinstance(a.get('suggestions'), list) and a['suggestions'], a
          PY
