name: PEAC checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core runtime
        run: python -m pip install -r requirements-core.txt

      - name: Python syntax check
        run: python -m py_compile peac.py peac_core.py peac_community.py peac_people.py peac_import.py peac_assistant.py peac_ai.py peac_mail.py peac_backup.py portal_auth.py portal_server.py local_server.py manage_accounts.py demo_seed.py wsgi.py

      - name: JavaScript syntax check
        run: |
          node --check public.js
          node --check login.js
          node --check auth.js
          node --check charts.js
          node --check script.js
          node --check console.js

      - name: Hosted-mode health smoke test
        env:
          PEAC_DEPLOY_MODE: hosted
          PEAC_HOST: 127.0.0.1
          PEAC_DB_PATH: /tmp/peac-ci.sqlite3
          PEAC_ADMIN_USERNAME: ci-admin
          PEAC_ADMIN_DISPLAY_NAME: CI Admin
          PEAC_ADMIN_PASSWORD: "CI-only-password-12345"
          PEAC_PORT: "5000"
          PEAC_FORCE_LUNCH_OPEN: "1"
          PEAC_ALLOWED_HOSTS: "ci.local"
        run: |
          python peac.py --local-server >/tmp/peac.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          from peac_community import CommunityService
          from portal_server import PortalRouter

          db=Path('/tmp/peac-flow.sqlite3')
          if db.exists(): db.unlink()
          service=CommunityService(db)
          service.auth.create_user({
              "username":"ci-admin","display_name":"CI Admin",
              "password":"CI-only-password-12345","role":"admin"
          },"ci")
          router=PortalRouter(service,Path('.'))
          host="ci.local"
          base={"Host":host}
          write={**base,"Origin":"https://"+host,"X-PEAC-Client":"1","Content-Type":"application/json"}

          def call(method,path,headers=None,payload=None):
              body=b"" if payload is None else json.dumps(payload).encode()
              status,data,mime,extra=router.handle(method,path,headers or base,"127.0.0.1","https",body)
              parsed=json.loads(data) if data else None
              return status,parsed,extra

          status,config,_=call("GET","/api/public/config")
          assert status==200 and config["lunch_enabled"] is True, config

          status,lunch,_=call("POST","/api/public/lunch",
              {**write,"Idempotency-Key":"ci-lunch-request-1234567890"},
              {"preferred_name":"CI Student","email":"ci.student@example.com","grade":"8",
               "preferred_date":date.today().isoformat(),"lunch_period":"Lunch A","support":"custom",
               "details":"Eat lunch and talk during Lunch A","consent":True,"website":""})
          assert status==201 and lunch["reference"].startswith("LB-"), lunch

          status,login,extra=call("POST","/api/auth/login",write,
              {"username":"ci-admin","password":"CI-only-password-12345"})
          assert status==200, login
          cookie=extra["Set-Cookie"].split(";",1)[0]
          private={**base,"Cookie":cookie}
          private_write={**write,"Cookie":cookie,"X-CSRF-Token":login["csrf"]}

          status_private_contact,private_contact,_=call("POST","/api/portal/contact-book",
              {**private_write,"Idempotency-Key":"ci-private-contact-1234567890"},
              {"name":"Private Friend","email":"friend@example.com","phone":"","note":"private","visibility":"private"})
          assert status_private_contact==201 and private_contact["visibility"]=="private", private_contact

          status_public_contact,public_contact,_=call("POST","/api/portal/contact-book",
              {**private_write,"Idempotency-Key":"ci-public-contact-1234567890"},
              {"name":"PEAC Contact","email":"peac@example.com","phone":"","note":"official","visibility":"public"})
          assert status_public_contact==201 and public_contact["visibility"]=="public", public_contact

          status_public_list,public_list,_=call("GET","/api/public/contacts",base)
          assert status_public_list==200 and len(public_list)==1 and public_list[0]["name"]=="PEAC Contact", public_list

          status_book,contact_book,_=call("GET","/api/portal/contact-book",private)
          assert status_book==200 and len(contact_book["mine"])==2 and len(contact_book["public"])==1, contact_book

          status,queue,_=call("GET","/api/portal/lunch",private)
          status2,notifications,_=call("GET","/api/portal/notifications",private)
          status3,assistant,_=call("POST","/api/portal/assistant/ask",private_write,
              {"question":"what about last week?",
               "history":[{"role":"user","content":"How many verified compliments this month?"}]})
          assert status==status2==status3==200
          assert len(queue["requests"])==1, queue
          request=queue["requests"][0]
          assert request["status"]=="new", request
          status4,approved_request,_=call("PUT","/api/portal/lunch/"+request["id"],{**private_write,"Idempotency-Key":"ci-approve-request-1234567890"},
              {"status":"approved","staff_note":"","version":request["version"]})
          assert status4==200 and approved_request["version"]==request["version"]+1, approved_request
          status5,queue_after,_=call("GET","/api/portal/lunch",private)
          assert status5==200 and queue_after["requests"][0]["status"]=="approved", queue_after

          status6,manual_entry,_=call("POST","/api/portal/lunch/manual",
              {**private_write,"Idempotency-Key":"ci-manual-lunch-1234567890"},
              {"date":service.today_fn().isoformat(),"grade":"7","lunch_period":"Lunch B","count":2,"note":"Offline lunch buddies"})
          assert status6==201 and manual_entry["count"]==2, manual_entry

          status7,dashboard,_=call("GET","/api/dashboard",private)
          assert status7==200, dashboard
          assert dashboard["lunch_buddies"]["approved_requests"]==1, dashboard["lunch_buddies"]
          assert dashboard["lunch_buddies"]["manual_total"]==2, dashboard["lunch_buddies"]
          assert dashboard["lunch_buddies"]["all_time_total"]==3, dashboard["lunch_buddies"]
          assert sum(r.get("lunch_buddies",0) for r in dashboard["analytics_entries"])==3

          assert notifications["unread"]>=1, notifications
          assert assistant["context_used"] is True, assistant
          assert isinstance(assistant.get("suggestions"),list) and assistant["suggestions"], assistant
          print("PEAC end-to-end smoke test passed")
          PY
